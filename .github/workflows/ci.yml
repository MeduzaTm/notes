name: CI

# Когда запускать: на каждый PR и на push в main (после слияния)
on:
  pull_request:
  push:
    branches: [main]

# Токену достаточно читать код
permissions:
  contents: read

# Новый коммит в ту же ветку отменяет устаревший запуск
concurrency:
  # для PR группа общая на весь PR, для main у каждого запуска своя (run_id), поэтому на main ничего не отменяется и не склеивается в очередь
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # на PR отменяем устаревший запуск, на main не отменяем: каждый коммит должен быть проверен
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    # Зависшая задача не должна съедать часы: через 10 минут её остановят
    timeout-minutes: 10
    steps:
      # Скачать код репозитория на раннер; токен после этого не оставляем в .git/config
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить инструменты
        run: pip install -r requirements-dev.txt

      # Та же цель Makefile, что ты запускаешь у себя: py_compile и ruff
      - name: Линтер
        run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Пусть упавшая версия не скрывает результат другой
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Внешних зависимостей у сервиса нет, ставить нечего
      - name: Тесты
        run: make test
